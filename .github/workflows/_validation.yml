name: Validation

on:
  workflow_call:
    inputs:
      base-ref:
        description: Pull request base branch for Buf breaking checks.
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  BUILD_CONFIGURATION: Release

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore for formatting
        run: dotnet restore MessageBridge.sln
      - name: Validate formatting
        run: dotnet format MessageBridge.sln --verify-no-changes --no-restore

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore for build
        run: dotnet restore MessageBridge.sln
      - name: Build solution
        run: dotnet build MessageBridge.sln -c "$BUILD_CONFIGURATION" --no-restore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore unit tests
        run: dotnet restore MessageBridge.UnitTests.slnf
      - name: Build unit tests
        run: dotnet build MessageBridge.UnitTests.slnf -c "$BUILD_CONFIGURATION" --no-restore
      - name: Restore coverage report tool
        run: dotnet tool restore --tool-manifest .config/dotnet-tools.json
      - name: Validate coverage tooling
        run: bash eng/verify-coverage.sh --self-test
      - name: Run unit tests with coverage
        run: >-
          dotnet test MessageBridge.UnitTests.slnf -c "$BUILD_CONFIGURATION" --no-restore --no-build
          --settings tests/coverlet.runsettings --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results/unit --logger "trx;LogFilePrefix=unit"
          --logger "console;verbosity=minimal"
      - name: Generate unit coverage report
        run: >-
          dotnet tool run reportgenerator
          -reports:"artifacts/test-results/unit/**/coverage.cobertura.xml"
          -targetdir:"artifacts/coverage-unit/report"
          -reporttypes:"HtmlSummary;HtmlChart;XmlSummary" -verbosity:off
      - name: Validate unit coverage
        run: bash eng/verify-coverage.sh --validate-unit artifacts/coverage-unit/report
      - name: Upload unit test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: |
            artifacts/test-results/unit
            artifacts/coverage-unit/report
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_ENVIRONMENT: Test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Verify Docker is available
        run: docker info
      - name: Restore integration tests
        run: dotnet restore tests/MessageBridge.IntegrationTests/MessageBridge.IntegrationTests.csproj
      - name: Build integration tests
        run: >-
          dotnet build tests/MessageBridge.IntegrationTests/MessageBridge.IntegrationTests.csproj
          -c "$BUILD_CONFIGURATION" --no-restore
      - name: Restore coverage report tool
        run: dotnet tool restore --tool-manifest .config/dotnet-tools.json
      - name: Run integration tests with coverage
        run: >-
          dotnet test tests/MessageBridge.IntegrationTests/MessageBridge.IntegrationTests.csproj
          -c "$BUILD_CONFIGURATION" --no-restore --no-build --settings tests/coverlet.runsettings
          --collect:"XPlat Code Coverage" --results-directory artifacts/test-results/integration
          --logger "trx;LogFilePrefix=integration" --logger "console;verbosity=minimal"
      - name: Generate integration coverage report
        run: >-
          dotnet tool run reportgenerator
          -reports:"artifacts/test-results/integration/**/coverage.cobertura.xml"
          -targetdir:"artifacts/coverage-integration/report" -reporttypes:"HtmlSummary;HtmlChart"
          -verbosity:off
      - name: Upload sanitized container logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-container-logs
          path: artifacts/container-logs
          if-no-files-found: warn
          retention-days: 14
      - name: Upload integration test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-test-results
          path: |
            artifacts/test-results/integration
            artifacts/coverage-integration/report
          if-no-files-found: warn
          retention-days: 14

  buf-checks:
    name: Buf checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
      - name: Lint protobuf contracts
        run: buf lint
      - name: Fetch base branch for comparison
        if: inputs.base-ref != ''
        env:
          BASE_REF: ${{ inputs.base-ref }}
        run: git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
      - name: Check breaking changes against base branch
        if: inputs.base-ref != ''
        env:
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          module_path="src/MessageBridge.Contracts/protos"
          if git ls-tree -r --name-only "origin/$BASE_REF" -- "$module_path" | grep -Eq '\.proto$'; then
            buf breaking --against ".git#branch=origin/$BASE_REF"
          else
            echo "No protobuf contracts found on $BASE_REF; skipping breaking-change comparison."
          fi

  samples:
    name: Sample build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore for sample build
        run: dotnet restore MessageBridge.sln
      - name: Build sample project
        run: >-
          dotnet build samples/MessageBridge.SampleClient/MessageBridge.SampleClient.csproj
          -c "$BUILD_CONFIGURATION" --no-restore

  package-generation:
    name: Package generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore for packing
        run: dotnet restore MessageBridge.sln
      - name: Pack NuGet packages
        run: |
          dotnet pack src/MessageBridge.Contracts/MessageBridge.Contracts.csproj -c "$BUILD_CONFIGURATION" --no-restore -o artifacts/packages
          dotnet pack src/MessageBridge.Publisher/MessageBridge.Publisher.csproj -c "$BUILD_CONFIGURATION" --no-restore -o artifacts/packages
          dotnet pack src/MessageBridge.Publisher.EntityFrameworkCore/MessageBridge.Publisher.EntityFrameworkCore.csproj -c "$BUILD_CONFIGURATION" --no-restore -o artifacts/packages

  workflow-contracts:
    name: Workflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate image delivery contracts
        run: |
          bash .github/scripts/tests/validation-image-jobs-contract.test.sh
          bash .github/scripts/tests/publish-images-workflow-contract.test.sh
          bash .github/scripts/tests/verify-anonymous-image.test.sh
          bash .github/scripts/tests/trivy-policy.test.sh
          bash .github/scripts/tests/publish-packages-independence.test.sh

  worker-image:
    name: Worker image contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Run worker image contract
        run: bash .github/scripts/tests/worker-image-contract.test.sh
      - name: Build worker image for supported platforms
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: src/MessageBridge.Worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Build local worker scan image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: src/MessageBridge.Worker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: messagebridge-worker:validation
          push: false
          cache-from: type=gha,scope=worker
      - name: Prepare worker scan report directory
        run: mkdir -p artifacts/trivy
      - name: Record worker vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: messagebridge-worker:validation
          format: table
          output: artifacts/trivy/worker.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
      - name: Block fixable worker vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: messagebridge-worker:validation
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Summarize worker vulnerabilities
        if: always()
        run: |
          {
            echo '### Worker image vulnerability report'
            echo '```text'
            cat artifacts/trivy/worker.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload worker vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-trivy-report
          path: artifacts/trivy/worker.txt
          if-no-files-found: warn
          retention-days: 14

  migration-image:
    name: Migration image contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Run migration image contract
        run: bash .github/scripts/tests/migration-image-contract.test.sh
      - name: Build migration image for supported platforms
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: src/MessageBridge.Worker/Dockerfile.migrate
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
      - name: Build local migration scan image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: src/MessageBridge.Worker/Dockerfile.migrate
          platforms: linux/amd64
          load: true
          tags: messagebridge-migrate:validation
          push: false
          cache-from: type=gha,scope=migrate
      - name: Prepare migration scan report directory
        run: mkdir -p artifacts/trivy
      - name: Record migrate vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: messagebridge-migrate:validation
          format: table
          output: artifacts/trivy/migrate.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
      - name: Block fixable migrate vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: messagebridge-migrate:validation
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Summarize migrate vulnerabilities
        if: always()
        run: |
          {
            echo '### Migration image vulnerability report'
            echo '```text'
            cat artifacts/trivy/migrate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload migrate vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migrate-trivy-report
          path: artifacts/trivy/migrate.txt
          if-no-files-found: warn
          retention-days: 14
